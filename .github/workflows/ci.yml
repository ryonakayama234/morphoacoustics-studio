name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Use npm version compatible with the Vite/Vitest peer graph
        run: npm install --global npm@11.6.0
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run test:bridge
      - run: npm run build
